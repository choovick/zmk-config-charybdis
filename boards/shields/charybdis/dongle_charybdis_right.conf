CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_EXT_POWER=y

CONFIG_PMW3610_ALT=y

# Trackball freeze mitigation
# default 0 (report every IRQ)
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=12
# default 2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
# default 1024
CONFIG_INPUT_THREAD_STACK_SIZE=1536
# default 16
CONFIG_INPUT_QUEUE_MAX_MSGS=32
# default n; fault -> reboot via src/fatal_reboot.c
CONFIG_HW_STACK_PROTECTION=y

# Split peripheral (dongle mode only)
# default 756
CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_STACK_SIZE=2048
# default 32
CONFIG_ZMK_INPUT_SPLIT_MSG_QUEUE_SIZE=64
# default 10
CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_POSITION_QUEUE_SIZE=20
# default 3
CONFIG_BT_BUF_ACL_TX_COUNT=10
# default = BT_BUF_ACL_TX_COUNT
CONFIG_BT_CONN_TX_MAX=10
# default 10; must be > BT_BUF_ACL_TX_COUNT
CONFIG_BT_BUF_EVT_RX_COUNT=12
