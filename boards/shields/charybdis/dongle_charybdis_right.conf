# Right half as split peripheral of a dongle. Shares the base settings with the
# standalone build, plus BLE split peripheral tuning that only exists in this role.

CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_EXT_POWER=y

CONFIG_PMW3610_ALT=y

# --- Trackball freeze mitigation ---

# Coalesce sensor motion into at most one report every 12ms (recommended by the driver
# for split peripherals). Default 0 sends 2 GATT notifications per sensor interrupt.
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=12

# Split peripheral notify thread does bt_gatt_notify in a loop on a 756-byte default
# stack; give it room. Larger queues absorb short radio stalls instead of dropping.
CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_STACK_SIZE=2048
CONFIG_ZMK_INPUT_SPLIT_MSG_QUEUE_SIZE=64
CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_POSITION_QUEUE_SIZE=20

# More outgoing ACL buffers so trackball traffic cannot starve key position updates.
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_CONN_TX_MAX=10

# Headroom for SPI burst reads (system workqueue) and the input thread.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
CONFIG_INPUT_THREAD_STACK_SIZE=1536
CONFIG_INPUT_QUEUE_MAX_MSGS=32

# Stack overflow -> fault -> reboot (src/fatal_reboot.c) instead of a silent hang.
CONFIG_HW_STACK_PROTECTION=y
