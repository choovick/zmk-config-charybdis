CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_EXT_POWER=y

CONFIG_PMW3610_ALT=y

# --- TEMPORARY diagnostics for the right-half freeze (remove once root-caused) ---
# Detailed PMW3610 driver logging: every SPI read/write and motion report.
CONFIG_PMW3610_ALT_LOG_LEVEL_DBG=y
# Periodically dump per-thread state + stack high-water-mark. If the freeze is a
# blocked SPI call, "sysworkq" will show as permanently pending here.
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=15
CONFIG_THREAD_NAME=y
# Turn a stack overflow into a reported fault instead of silent corruption.
CONFIG_HW_STACK_PROTECTION=y
# --- end temporary diagnostics ---
