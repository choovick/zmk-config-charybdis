CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_EXT_POWER=y

CONFIG_PMW3610_ALT=y

# --- Trackball freeze mitigation (shared by standalone and dongle-peripheral builds) ---

# Coalesce sensor motion into at most one report every 12ms. The default (0) emits an
# X and a Y event on every sensor interrupt (~8ms), which floods the input/split queues.
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=12

# Headroom for SPI burst reads on the system workqueue and input processors on the
# input thread (defaults: 2048 / 1024 / 16).
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
CONFIG_INPUT_THREAD_STACK_SIZE=1536
CONFIG_INPUT_QUEUE_MAX_MSGS=32

# Turn a stack overflow into a fault (and reboot, see src/fatal_reboot.c) instead of
# silent memory corruption that leaves the half frozen until a manual power cycle.
CONFIG_HW_STACK_PROTECTION=y
