CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_EXT_POWER=y

CONFIG_PMW3610_ALT=y

# Trackball freeze mitigation
# default 0 (report every IRQ)
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=12
# default 2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
# default 1024
CONFIG_INPUT_THREAD_STACK_SIZE=1536
# default 16
CONFIG_INPUT_QUEUE_MAX_MSGS=32
# default n; fault -> reboot via src/fatal_reboot.c
CONFIG_HW_STACK_PROTECTION=y

# Sensor power saving: ~10 min of no motion before deep rest (REST3)
# default 128 (Kconfig max 3264)
CONFIG_PMW3610_ALT_RUN_DOWNSHIFT_TIME_MS=3264
# default 40; REST1 wake latency
CONFIG_PMW3610_ALT_REST1_SAMPLE_TIME_MS=20
# default 5000; max 255*16*REST1_SAMPLE = 81600
CONFIG_PMW3610_ALT_REST1_DOWNSHIFT_TIME_MS=60000
# default 100; REST2 wake latency
CONFIG_PMW3610_ALT_REST2_SAMPLE_TIME_MS=40
# default 17000; max 255*128*REST2_SAMPLE = 1305600
CONFIG_PMW3610_ALT_REST2_DOWNSHIFT_TIME_MS=540000
